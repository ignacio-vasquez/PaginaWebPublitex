<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/styles.css">
    <title>Superadmin | Publitex</title>
  </head>
  <body class="quote-page">
    <header>
      <p><a href="index.html#inicio" aria-label="Publitex, ir al inicio">Publitex</a></p>
      <nav aria-label="Navegación de superadmin"><ul>
        <li><a href="index.html#inicio">Inicio</a></li>
        <li><a data-project-link href="gestion.html">Gestión</a></li>
        <li><a data-session-link href="acceso.html">Mi cuenta</a></li>
      </ul></nav>
    </header>
    <main data-superadmin-page>
      <section aria-labelledby="superadmin-title">
        <p class="eyebrow">Publitex</p>
        <h1 id="superadmin-title">Actuar como otra persona</h1>
        <p>Elige una cuenta para revisar su parte del proceso sin cerrar tu sesión.</p>
        <div role="tablist" aria-label="Tipo de cuenta" class="actor-tabs">
          <button type="button" role="tab" data-actor-tab="staff" aria-controls="actor-list" aria-selected="true">Trabajadores</button>
          <button type="button" role="tab" data-actor-tab="clients" aria-controls="actor-list" aria-selected="false">Clientes</button>
        </div>
        <p data-superadmin-status role="status" aria-live="polite">Cargando personas…</p>
        <div id="actor-list" data-actor-list role="tabpanel" class="actor-list"></div>
      </section>
    </main>
    <footer><p><strong>Publitex</strong> — Publicidad visual</p><a href="index.html#inicio">Volver al inicio</a></footer>
    <script type="module" src="js/app.js"></script>
